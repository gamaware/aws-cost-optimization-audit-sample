# Thin caller: shared checks come from gamaware/.github; repo checks run the same `make verify` as
# a local run. No job gets cloud credentials or an id-token.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-docs:
    uses: gamaware/.github/.github/workflows/lint-docs.yml@main
    permissions:
      contents: read

  lint-actions:
    uses: gamaware/.github/.github/workflows/lint-actions.yml@main
    permissions:
      contents: read

  secrets:
    uses: gamaware/.github/.github/workflows/secrets.yml@main
    permissions:
      contents: read

  security:
    uses: gamaware/.github/.github/workflows/security.yml@main
    permissions:
      contents: read

  verify:
    name: make verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - run: uv sync --frozen
      - run: make verify

  report:
    name: report PDF
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      PANDOC_VERSION: "3.11"
      PANDOC_SHA256: 89d4c9d97818c62a97157f0072844e4602c6cee795bf84abd1aee7273abcda99
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: Install pinned pandoc
        run: |
          deb="pandoc-${PANDOC_VERSION}-1-amd64.deb"
          curl -sSfL -o "$RUNNER_TEMP/$deb" "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/$deb"
          echo "${PANDOC_SHA256}  $RUNNER_TEMP/$deb" | sha256sum --check
          sudo dpkg -i "$RUNNER_TEMP/$deb"
      - run: uv sync --frozen
      - name: Rebuild evidence, report and PDF, then require no diff
        run: |
          make evidence
          git diff --exit-code -- evidence report
          test -z "$(git status --porcelain -- evidence report)"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harbor-goods-cost-audit-report
          path: |
            report/REPORT.md
            report/REPORT.pdf
          retention-days: 30
