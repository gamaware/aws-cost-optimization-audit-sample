# Thin caller: shared checks come from gamaware/.github; repo checks run the same `make verify` as
# a local run. No job gets cloud credentials or an id-token.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-docs:
    name: lint-docs
    uses: gamaware/.github/.github/workflows/lint-docs.yml@1255caafb08b06cc4658318c4dd48f9dea946c9e # gamaware/.github initial workflows
    permissions:
      contents: read

  lint-actions:
    name: lint-actions
    uses: gamaware/.github/.github/workflows/lint-actions.yml@1255caafb08b06cc4658318c4dd48f9dea946c9e # gamaware/.github initial workflows
    permissions:
      contents: read

  secrets:
    name: secrets
    uses: gamaware/.github/.github/workflows/secrets.yml@1255caafb08b06cc4658318c4dd48f9dea946c9e # gamaware/.github initial workflows
    permissions:
      contents: read

  security:
    name: security
    uses: gamaware/.github/.github/workflows/security.yml@1255caafb08b06cc4658318c4dd48f9dea946c9e # gamaware/.github initial workflows
    permissions:
      contents: read

  report:
    name: report
    uses: gamaware/.github/.github/workflows/report.yml@1255caafb08b06cc4658318c4dd48f9dea946c9e # gamaware/.github initial workflows
    permissions:
      contents: read
    with:
      # Same arguments as scripts/build_pdf.py, so the artifact matches the committed PDF.
      pandoc-args: --pdf-engine=xelatex -V papersize=a4 -V geometry:margin=1.8cm -V geometry:landscape --toc
      evidence-command: >-
        python -m pip install --quiet uv==0.12.19 &&
        uv sync --frozen &&
        PYTHONPATH=scripts uv run --frozen python -m costaudit build
      evidence-path: evidence

  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - run: uv sync --frozen
      - run: make verify
